const reqAmt=r=>{const q=selQuote(r);return q?q.amt:0};

function contract(p){return p.boq.reduce((a,b)=>a+b.t,0)}
function varsApproved(p){return S.variations.filter(v=>v.pid===p.id&&v.client==='approved').reduce((a,v)=>a+v.amt,0)}
function budget(p){return contract(p)+varsApproved(p)}
function itemSpent(p,code){
  const b=p.boq.find(x=>x.c===code);let s=b?b.sp:0;
  S.requests.forEach(r=>{if(r.pid===p.id&&r.boq===code&&r.stage==='done')s+=reqAmt(r)});
  S.petty.forEach(c=>{if(c.pid===p.id&&c.boq===code&&c.status==='approved')s+=c.amt});
  return s;
}
function spent(p){
  let s=p.boq.reduce((a,b)=>a+b.sp,0);
  S.requests.forEach(r=>{if(r.pid===p.id&&r.stage==='done')s+=reqAmt(r)});
  S.petty.forEach(c=>{if(c.pid===p.id&&c.status==='approved')s+=c.amt});
  return s;
}
function committed(p,code,exceptId){
  return S.requests.filter(r=>r.pid===p.id&&['finance','gm','po'].includes(r.stage)&&r.id!==exceptId&&(code===undefined||r.boq===code)).reduce((a,r)=>a+reqAmt(r),0);
}
function progress(p){const t=contract(p);return t?p.boq.reduce((a,b)=>a+b.t*b.p,0)/t:0}
function secProgress(p,s){const it=p.boq.filter(b=>b.s===s);const t=it.reduce((a,b)=>a+b.t,0);return t?it.reduce((a,b)=>a+b.t*b.p,0)/t:0}
function timePct(p){const a=D(p.start),b=D(p.end);return Math.max(0,Math.min(100,(today-a)/(b-a)*100))}
function daysLeft(p){return daysBetween(today,D(p.end))}
function health(p){
  const pr=progress(p),dl=daysLeft(p),tp=timePct(p);
  if(p.status==='closed')return{k:'closed',l:'مغلق',c:'p-idle'};
  if(p.status==='stopped')return{k:'stopped',l:'متوقف',c:'p-idle',why:p.stopReason};
  if(dl<0&&pr<100)return{k:'late',l:'متأخر عن التسليم',c:'p-bad',why:'تجاوز موعد التسليم ب'+(-dl)+' يوم والإنجاز '+Math.round(pr)+'%'};
  if(tp-pr>=15||(dl<=21&&pr<85))return{k:'risk',l:'يحتاج اهتمام',c:'p-warn',why:'باقي '+dl+' يوم والإنجاز '+Math.round(pr)+'% فقط من العمل'};
  if(pr>=85)return{k:'near',l:'قارب على الانتهاء',c:'p-acc'};
  return{k:'ok',l:'ضمن الخطة',c:'p-ok'};
}
function stageInfo(r){if(r.stage==='rejected')return{l:'مرفوض',c:'p-bad'};if(r.stage==='done')return{l:'أُرسل PO',c:'p-ok'};const s=STAGES.find(x=>x.k===r.stage);return{l:'بانتظار: '+s.l,c:r.stage==='dept'?'p-idle':'p-warn'}}
function myQueue(){
  const role=S.role;
  const reqs=S.requests.filter(r=>{const s=STAGES.find(x=>x.k===r.stage);return s&&s.role===role});
  const pc=role==='gm'?S.petty.filter(c=>c.status==='pending'):[];
  return{reqs,pc,n:reqs.length+pc.length};
}
function bar(pct,cls,marker){return '<div class="bar"><i class="'+(cls||'')+'" style="width:'+Math.min(100,Math.max(0,pct)).toFixed(1)+'%"></i>'+(marker!=null?'<b style="inset-inline-start:calc('+Math.min(100,marker).toFixed(1)+'% - 1px)" title="الوقت المنقضي"></b>':'')+'</div>'}
function boqOptions(p,sel,allowNone){
  let h=allowNone?'<option value="">خارج BOQ / غير محدد</option>':'';
  p.sections.forEach(([s,n])=>{h+='<optgroup label="'+esc(s+' - '+n)+'">';p.boq.filter(b=>b.s===s).forEach(b=>{h+='<option value="'+esc(b.c)+'"'+(b.c===sel?' selected':'')+'>'+esc(b.c+' '+b.d)+'</option>'});h+='</optgroup>'});
  return h;
}
function projOptions(sel){return S.projects.filter(p=>p.status!=='closed').map(p=>'<option value="'+p.id+'"'+(p.id===sel?' selected':'')+'>'+esc(p.short)+'</option>').join('')}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

function views(){
  const h=location.hash.slice(1)||'dashboard';
  if(h==='dashboard')return vDash();
  if(h==='projects')return vProjects();
  if(h.startsWith('p-'))return vProject(h.slice(2));
  if(h==='requests')return vRequests();
  if(h.startsWith('r-'))return vRequest(h.slice(2));
  if(h==='petty')return vPetty();
  if(h==='inbox')return vInbox();
  return vDash();
}

function rejStage(r){const last=r.hist[r.hist.length-1];return({head:'dept',procurement:'procurement',finance:'finance',gm:'gm'})[last.role]||'dept'}
function budgetCheck(r,p){
  const amt=reqAmt(r);const b=r.boq?p.boq.find(x=>x.c===r.boq):null;
  const pb=budget(p),ps=spent(p),pc=committed(p,undefined,r.id);const premain=pb-ps-pc-amt;
  let h='<div class="check">';
  if(b){const is=itemSpent(p,b.c),ic=committed(p,b.c,r.id),rem=b.t-is-ic-amt;
    h+='<div class="flag ok">✓ الطلب ضمن بند BOQ رقم '+esc(b.c)+': '+esc(b.d)+'</div>'+
      '<div class="row"><span>قيمة البند في BOQ</span><b class="num">'+money(b.t)+'</b></div>'+
      '<div class="row"><span>المصروف على البند</span><b class="num">'+money(is)+'</b></div>'+
      '<div class="row"><span>طلبات أخرى معتمدة قيد الشراء</span><b class="num">'+money(ic)+'</b></div>'+
      '<div class="row"><span>قيمة هذا الطلب</span><b class="num">'+money(amt)+'</b></div>'+
      '<div class="row"><span>المتبقي في البند بعد الطلب</span><b class="num" style="color:'+(rem<0?'var(--bad)':'var(--ok)')+'">'+money(rem)+'</b></div>';
    if(rem<0)h+='<div class="flag bad">الطلب يتجاوز قيمة البند ب '+money(-rem)+' ر.ع</div>';
  }else h+='<div class="flag warn">الطلب غير مرتبط ببند في BOQ. إذا كان عملاً خارج العقد، يُسجّل كعمل إضافي مع موافقة العميل.</div>';
  h+='<div class="row"><span>ميزانية المشروع / المتبقي بعد الطلب</span><b class="num">'+money(pb)+' / <span style="color:'+(premain<0?'var(--bad)':'inherit')+'">'+money(premain)+'</span></b></div></div>';
  return h;
}

  if(r.stage==='finance')return '<div class="panel"><h2>تدقيق الميزانية</h2>'+budgetCheck(r,p)+noteF+'<div class="actions"><button class="btn ok" data-act="approve" data-v="'+r.id+'">ضمن الميزانية، إرسال للمدير العام</button><button class="btn bad" data-act="reject" data-v="'+r.id+'">رفض</button></div></div>';
  if(r.stage==='gm'){const q=selQuote(r);return '<div class="panel"><h2>الاعتماد النهائي للشراء</h2><div class="check"><div class="row"><span>المورّد</span><b>'+esc(q.sup)+'</b></div><div class="row"><span>المبلغ</span><b class="num">'+money(q.amt)+' ر.ع</b></div><div class="row"><span>الدفع</span><b>'+TERMS[q.terms]+'</b></div></div>'+budgetCheck(r,p)+noteF+'<div class="actions"><button class="btn ok" data-act="approve" data-v="'+r.id+'">اعتماد الشراء</button><button class="btn bad" data-act="reject" data-v="'+r.id+'">رفض</button></div></div>'}

  delLine:(d,el)=>{const ls=document.querySelectorAll('#nr-lines .line');if(ls.length>1)el.closest('.line').remove()},
  qsel:d=>{const r=R(location.hash.slice(3));r.quotes.forEach((q,i)=>q.sel=i==d.v);save();render()},
  qdel:d=>{const r=R(location.hash.slice(3));r.quotes.splice(+d.v,1);if(r.quotes.length&&!selQuote(r))r.quotes[0].sel=true;save();render()},
  approve:d=>{
    const r=R(d.v),note=(document.getElementById('actnote')||{}).value||'';const by=me(),t=nowStamp();
    const msgs={dept:'وافق رئيس القسم',procurement:'سجّل عروض الأسعار وأرسل للمالية',finance:'وافقت المالية',gm:'اعتمد المدير العام'};
    if(r.stage==='po'){S.seq.po++;r.po={no:'PO-2026-0'+S.seq.po,date:iso(today)};r.hist.push({t,by,role:S.role,a:'أصدر أمر الشراء '+r.po.no+' وأرسله للمورّد',note});r.stage='done';toast('صدر أمر الشراء '+r.po.no)}
    else{r.hist.push({t,by,role:S.role,a:msgs[r.stage],note});const i=STAGES.findIndex(s=>s.k===r.stage);r.stage=STAGES[i+1].k;toast('تم. الطلب الحين عند: '+ROLES[STAGES[i+1].role].label)}
    save();render();
  },
  reject:d=>{
    const r=R(d.v),note=(document.getElementById('actnote')||{}).value||'';
    if(!note.trim()){toast('اكتب سبب الرفض في خانة الملاحظة');document.getElementById('actnote').focus();return}
    r.hist.push({t:nowStamp(),by:me(),role:S.role,a:r.stage==='procurement'?'ألغت المشتريات الطلب':'رفض '+ROLES[S.role].label,note});r.stage='rejected';save();render();toast('تم رفض الطلب');
  },
  pcOk:d=>{const c=S.petty.find(x=>x.id===d.v);c.status='approved';c.dec=iso(today);save();render();toast('اعتُمد '+c.id+' وأُضيف لمصروفات المشروع')},
  pcNo:d=>{const c=S.petty.find(x=>x.id===d.v);c.status='rejected';save();render();toast('رُفض '+c.id)},
  voApprove:d=>{const v=S.variations.find(x=>x.id===d.v);modal('رفع موافقة العميل - '+v.title,'<form class="f" data-form="voFile" data-v="'+v.id+'"><label class="fld"><span>ملف الموافقة</span><input id="vf" type="file" accept="image/*,.pdf" required></label><div class="actions"><button class="btn pri" type="submit">رفع واعتماد</button><button class="btn" type="button" data-act="close">إلغاء</button></div></form>')}
};
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  const a=e.target.closest('[data-act]');
  if(a&&a.tagName!=='SELECT'){const k=a.dataset.act;if(A[k]){if(k!=='closeOv'&&k!=='qsel')e.preventDefault();A[k](a.dataset,a,e);return}}
  if(go&&!e.target.closest('a,button,input')){location.hash=go.dataset.go}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'){const g=e.target.closest&&e.target.closest('[data-go]');if(g&&g.tagName==='DIV')location.hash=g.dataset.go}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='role'||t.id==='role2'){S.role=t.value;save();render();toast('أنت الحين: '+ROLES[S.role].label);return}
  if(t.dataset.prog){const p=P(t.dataset.p),b=p.boq.find(x=>x.c===t.dataset.prog);b.p=Math.max(0,Math.min(100,Math.round(+t.value||0)));save();render();toast('تم تحديث إنجاز البند '+b.c);return}
  if(t.id==='nr-p'){const p=P(t.value);document.getElementById('nr-b').innerHTML=boqOptions(p,'',true);document.getElementById('nr-d').innerHTML=p.depts.map(d=>'<option value="'+d+'">'+DEPTS[d]+'</option>').join('')}
  if(t.id==='pc-p'){document.getElementById('pc-b').innerHTML=boqOptions(P(t.value),'',true)}
});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();const v=id=>document.getElementById(id).value;
  const fileName=id=>{const el=document.getElementById(id);return el&&el.files&&el.files[0]?el.files[0].name:''};
  if(f.dataset.form==='req'){
    const items=[...f.querySelectorAll('.line')].map(l=>({d:l.querySelector('.l-d').value.trim(),q:+l.querySelector('.l-q').value,u:l.querySelector('.l-u').value.trim()||'عدد'})).filter(i=>i.d);
    const id='REQ-'+(S.seq.req++);
    S.requests.push({id,pid:v('nr-p'),boq:v('nr-b')||null,dept:v('nr-d'),by:me(),date:iso(today),need:v('nr-need'),items,note:v('nr-note'),stage:'dept',quotes:[],hist:[{t:nowStamp(),by:me(),role:S.role,a:'أنشأ الطلب',note:''}]});
    save();closeModal();location.hash='r-'+id;render();toast('أُرسل الطلب '+id+' لرئيس القسم');
  }else if(f.dataset.form==='quote'){
    const r=R(f.dataset.v);r.quotes.forEach(q=>q.sel=false);
    r.quotes.push({sup:v('q-sup'),amt:+v('q-amt'),terms:v('q-terms'),days:+v('q-days')||0,sel:true});
    const best=r.quotes.reduce((a,q)=>q.amt<a.amt?q:a);r.quotes.forEach(q=>q.sel=q===best);
    save();render();toast('أُضيف العرض، واختير الأرخص تلقائياً');
  }else if(f.dataset.form==='petty'){
    const id='PC-'+(S.seq.pc++);
    S.petty.push({id,pid:v('pc-p'),boq:v('pc-b')||null,amt:+v('pc-a'),d:v('pc-d'),by:me(),date:iso(today),status:'pending',file:fileName('pc-f')});
    save();closeModal();render();toast('أُرسل '+id+' للمدير العام');
  }else if(f.dataset.form==='vo'){
    const file=fileName('vo-f');const id='VO-'+String(S.seq.vo++).padStart(2,'0');
    S.variations.push({id,pid:f.dataset.v,title:v('vo-t'),d:v('vo-d'),amt:+v('vo-a'),file,client:file?'approved':'pending',date:iso(today),by:me()});
    ui.tab='vo';save();closeModal();render();toast(file?'أُضيف العمل الإضافي ومعه موافقة العميل':'أُضيف العمل الإضافي بانتظار موافقة العميل');
  }else if(f.dataset.form==='voFile'){
    const vo=S.variations.find(x=>x.id===f.dataset.v);vo.file=fileName('vf');vo.client='approved';save();closeModal();render();toast('اعتُمد العمل الإضافي وأُضيف لقيمة المشروع');
  }
});
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#p-'))ui.tab=ui.tab||'boq';render();window.scrollTo(0,0)});

function render(){
  const q=myQueue();const h=location.hash.slice(1)||'dashboard';
  const sec=h.startsWith('p-')?'projects':h.startsWith('r-')?'requests':h;
  const items=[['dashboard','لوحة المتابعة','dash'],['projects','المشاريع','proj'],['requests','طلبات المواد','req'],['petty','بيتي كاش','cash'],['inbox','بانتظار إجرائي','inbox']];
  document.getElementById('nav').innerHTML=items.map(([k,l,i])=>'<a href="#'+k+'" class="'+(sec===k?'on':'')+'">'+ico(i)+l+(k==='inbox'&&q.n?'<span class="badge">'+q.n+'</span>':'')+'</a>').join('');
  document.getElementById('bnav').innerHTML=items.map(([k,l,i])=>'<a href="#'+k+'" class="'+(sec===k?'on':'')+'">'+ico(i)+'<span>'+l.replace('بانتظار إجرائي','إجرائي').replace('لوحة المتابعة','المتابعة').replace('طلبات المواد','الطلبات')+'</span>'+(k==='inbox'&&q.n?'<span class="badge">'+q.n+'</span>':'')+'</a>').join('');
  const opts=Object.entries(ROLES).map(([k,r])=>'<option value="'+k+'"'+(k===S.role?' selected':'')+'>'+r.label+'</option>').join('');
  document.getElementById('role').innerHTML=opts;
  document.getElementById('view').innerHTML='<div class="mrole"><label for="role2" class="small muted">تجربة بصفة</label><select id="role2">'+opts+'</select></div>'+views();
}
render();
})();
</script>
